name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v, e.g. 0.3.0-rc1)'
        required: true
        default: '0.0.0-dev'

jobs:
  build-macos:
    runs-on: macos-14
    env:
      APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD:   ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_API_KEY_ID:                   ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID:                ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64:            ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve FOGHORN_VERSION
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            echo "FOGHORN_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "FOGHORN_VERSION=$DISPATCH_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Require macOS signing credentials
        run: |
          required=(
            APPLE_DEVELOPER_ID_CERT_P12_BASE64
            APPLE_DEVELOPER_ID_CERT_PASSWORD
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_API_KEY_P8_BASE64
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: foghorn-macos-dmg
          path: build/bin/foghorn-*-universal.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            patchelf \
            desktop-file-utils \
            zsync

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache linuxdeploy
        uses: actions/cache@v4
        with:
          path: build/.cache
          key: linuxdeploy-1-alpha-20240109-1

      - name: Resolve FOGHORN_VERSION
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            echo "FOGHORN_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "FOGHORN_VERSION=$DISPATCH_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: foghorn-linux-appimage
          path: build/bin/foghorn-*-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$env:GITHUB_PATH"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)\bin" >> "$env:GITHUB_PATH"

      - name: Resolve FOGHORN_VERSION
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            echo "FOGHORN_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "FOGHORN_VERSION=$DISPATCH_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: foghorn-windows-installer
          path: build/bin/foghorn-*-amd64-installer.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from tag annotation
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          # Use the annotated tag message body (everything after the subject line)
          # as the release notes; fall back to auto-generated notes if the tag
          # is lightweight or carries no message (e.g. a dev workflow_dispatch).
          if git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)' > "$BODY_FILE" && [ -s "$BODY_FILE" ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            : > "$BODY_FILE"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          ls -lah artifacts
          test -n "$(find artifacts -maxdepth 1 -name 'foghorn-*-universal.dmg' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'foghorn-*-x86_64.AppImage' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'foghorn-*-amd64-installer.exe' -print -quit)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/foghorn-*-universal.dmg
            artifacts/foghorn-*-x86_64.AppImage
            artifacts/foghorn-*-amd64-installer.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
