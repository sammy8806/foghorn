<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- Defence in depth: the app is fully self-contained (bundled assets, no
         remote fetches), so nothing needs to load from the network. This blunts
         the impact of any script that does get injected via alert content. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>foghorn</title>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
